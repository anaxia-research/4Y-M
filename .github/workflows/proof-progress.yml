name: Verify proof progress
on:
  push:
    branches: [main, 'research/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl --retry 3 -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib cache
        run: lake exe cache get
      - name: Build the complete proof project
        run: lake build
      - name: Audit new proof dependencies
        shell: bash
        run: |
          set -o pipefail
          lake env lean scripts/ErrorStableAxioms.lean | tee /tmp/error-stable-axioms.txt
          python3 scripts/check_progress_axioms.py /tmp/error-stable-axioms.txt
  exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_closure_progress.py
      - run: git diff --exit-code -- research/2026-11-15/verification.json
